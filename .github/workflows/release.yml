name: Build and release Deals

# Publishing a release: bump Version.txt and ENGINE_VERSION, commit, then
#   git tag v26 && git push origin v26
# (or run this workflow by hand from the Actions tab to just test the build).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the build to this existing release tag (e.g. v25). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check the version number matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ENG=$(grep -m1 -oE '^ENGINE_VERSION = [0-9]+' engine.py | grep -oE '[0-9]+')
          FILE=$(head -n1 Version.txt | tr -d '\r ')
          echo "tag=$TAG engine=$ENG Version.txt=$FILE"
          [ "$TAG" = "$ENG" ] && [ "$TAG" = "$FILE" ] || { echo "Version mismatch"; exit 1; }

      - name: Build Deals.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name Deals
          --collect-all playwright
          --hidden-import lxml.etree --hidden-import keyring.backends.Windows
          --add-data "engine.py;." --add-data "ui_kit.py;." --add-data "selftest.py;."
          --add-data "Fixtures;Fixtures"
          DealScraper.pyw

      - name: Smoke-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Deals\Deals.exe" -ArgumentList "--selftest" -Wait -PassThru
          $res = Join-Path $env:APPDATA "Deals\selftest_result.txt"
          if (Test-Path $res) { Get-Content $res }
          if ($p.ExitCode -ne 0) { throw "Deals.exe --selftest failed (exit $($p.ExitCode))" }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path engine.py -Pattern '^ENGINE_VERSION = (\d+)').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer.iss
          $h = (Get-FileHash dist\Deals-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Deals-Setup.exe" | Out-File -Encoding ascii dist\Deals-Setup.exe.sha256

      - name: Upload build (for manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Deals-Setup
          path: dist/Deals-Setup.exe*

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          grep -E '^note:' Version.txt | sed -E 's/^note:[[:space:]]*/- /' > notes.md || true
          [ -s notes.md ] || echo "- Improvements and fixes" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release already exists (e.g. made on the website): attach the files and fill in the notes
            gh release upload "$TAG" dist/Deals-Setup.exe dist/Deals-Setup.exe.sha256 --clobber
            gh release edit "$TAG" --title "Deals $TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/Deals-Setup.exe dist/Deals-Setup.exe.sha256 \
              --title "Deals $TAG" --notes-file notes.md
          fi
